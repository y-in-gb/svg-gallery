<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="250" fill="#f8f9fa" />

  <!-- ===== 坐标轴 ===== -->
  <line x1="0" y1="0" x2="0" y2="250" stroke="#e74c3c" stroke-width="1.5" />
  <line x1="0" y1="0" x2="400" y2="0" stroke="#3498db" stroke-width="1.5" />

  <!-- X轴刻度 -->
  <g font-size="10" fill="#e74c3c" text-anchor="middle">
    <line x1="50" y1="0" x2="50" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="50" y="18">50</text>
    <line x1="100" y1="0" x2="100" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="100" y="18">100</text>
    <line x1="150" y1="0" x2="150" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="150" y="18">150</text>
    <line x1="200" y1="0" x2="200" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="200" y="18">200</text>
    <line x1="250" y1="0" x2="250" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="250" y="18">250</text>
    <line x1="300" y1="0" x2="300" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="300" y="18">300</text>
    <line x1="350" y1="0" x2="350" y2="5" stroke="#e74c3c" stroke-width="1" />
    <text x="350" y="18">350</text>
  </g>

  <!-- Y轴刻度 -->
  <g font-size="10" fill="#3498db" text-anchor="end">
    <line x1="0" y1="50" x2="5" y2="50" stroke="#3498db" stroke-width="1" />
    <text x="12" y="54">50</text>
    <line x1="0" y1="100" x2="5" y2="100" stroke="#3498db" stroke-width="1" />
    <text x="12" y="104">100</text>
    <line x1="0" y1="150" x2="5" y2="150" stroke="#3498db" stroke-width="1" />
    <text x="12" y="154">150</text>
    <line x1="0" y1="200" x2="5" y2="200" stroke="#3498db" stroke-width="1" />
    <text x="12" y="204">200</text>
  </g>

  <text x="5" y="12" font-size="11" fill="#2c3e50" font-weight="bold">(0,0)</text>
  <text x="390" y="12" font-size="12" fill="#e74c3c" font-weight="bold">→ X</text>
  <text x="12" y="240" font-size="12" fill="#3498db" font-weight="bold">↑ Y</text>

  <!-- 辅助网格 -->
  <g stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="50" y1="0" x2="50" y2="250" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="250" y1="0" x2="250" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="350" y1="0" x2="350" y2="250" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
  </g>

  <!-- ===== 丹凤眼 ===== -->
  <path d="M 230,50
           Q 280,45 330,30
           Q 280,110 200,115
           Q 100,120 100,120
           Q 75,115 100,90
           Q 110,75 130,65
           Q 160,52 230,50 Z"
        fill="none" stroke="black" stroke-width="2" />

  <!-- 眼珠 -->
  <circle cx="200" cy="82" r="28" fill="black" />
  <circle cx="210" cy="68" r="9" fill="white" />

</svg>